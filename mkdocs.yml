site_name: AMBER
site_description: A Python-based discrete-event simulator for 6G Ambient IoT Networks
site_url: https://mrnmir.github.io/Amber/
repo_url: https://github.com/mrnmir/Amber

theme:
  name: material
  logo: assets/logo_white.svg
  favicon: assets/logo_white.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/extra.css

watch:
  - amber

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - API Reference:
      - backscatter: api/backscatter.md
      - bsengine: api/bsengine.md
      - capacitor: api/capacitor.md
      - controller: api/controller.md
      - energy: api/energy.md
      - packet_analysis: api/packet_analysis.md
      - propagation: api/propagation.md
      - radiodevices: api/radiodevices.md
