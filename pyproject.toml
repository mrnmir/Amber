[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "amber"
version = "0.1.0"
description = "A Python-based discrete-event simulator for 6G Ambient IoT Networks"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Mirana Manafova", email = "mirana.manafova@angstrom.uu.se" }]
dependencies = [
    "matplotlib>=3.4",
    "numpy>=1.19.3",
    "pandas>=1.1.3",
    "simpy>=4.0",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/mrnmir/Amber"

[tool.setuptools]
packages = ["amber"]
