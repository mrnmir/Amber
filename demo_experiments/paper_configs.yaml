# =============================================================================
# Experiment configurations for
#   "Amber: 6G Ambient IoT Simulator"
# =============================================================================

# -----------------------------------------------------------------------------
# Shared across the application experiments (Figs. 4-6, 8)
# -----------------------------------------------------------------------------
common:
  carrier_frequency_hz: 924.0e6
  pathloss_model: macro            # 3GPP TR 38.901 Urban Macrocell, LOS
  simulation_duration_ms: 10000
  timestep_s: 1.0e-3

  capacitor:
    capacitance_f: 300.0e-6
    series_resistance_ohm: 5.0e3
    leakage_resistance_ohm: 0.1e6
    v_threshold_high_v: 1.7        # node switches on
    v_threshold_low_v: 1.3         # node returns to charge-only

  base_stations:
    count: 3
    sectors_per_bs: 3
    antenna_type: 3GPP             # TR 38.901 horizontal pattern
    transmit_power_dbm: 30
    antenna_gain_dbi: 17.0
    height_m: 25.0

  nodes:
    antenna_type: omni
    antenna_gain_dbi: 1.0
    height_m: 2.0
    external_source: "threehundred_seconds_stable.xlsx"

  receiver:                        # collision handling at the base station
    required_sinr_db: 3.0
    enable_sic: true
    cancellation_factor: 0.9       # imperfect cancellation
    noise_figure_db: 6.0
    bandwidth_hz: 100.0e6

# -----------------------------------------------------------------------------
# Fig. 1 - Capacitor dynamics (Section V, analytical verification)
# -----------------------------------------------------------------------------
fig1_capacitor_dynamics:
  carrier_frequency_hz: 924.0e6
  pathloss_model: macro
  simulation_duration_ms: 10000
  timestep_s: 1.0e-3

  base_station:
    transmit_power_dbm: 46
    antenna_gain_dbi: 15
    beamwidth_deg: 120
    azimuth_deg: 0
    height_m: 25.0

  nodes:                            
    common:
      height_m: 1.5
      sensitivity_dbm: -100
      efficiency: 0.7              
    list:
      - {id: 0, distance_m: 20,  energy_mode: wpt}
      - {id: 1, distance_m: 30,  energy_mode: wpt}
      - {id: 2, distance_m: 100, energy_mode: hybrid}

  capacitor:
    capacitance_f: 300.0e-6
    series_resistance_ohm: 5.0e3
    leakage_resistance_ohm: 0.1e6
    v_threshold_high_v: 1.7
    v_threshold_low_v: 1.3

  fsm_states:
    listening:    {duration_ms: 5,  current_a: 1.40e-4}
    sensing:      {duration_ms: 2,  current_a: 5.12e-4}
    processing:   {duration_ms: 5,  current_a: 1.28e-3}
    transmitting: {duration_ms: 15, current_a: 5.00e-3}

  bs_schedule:
    tx_slot_ms: 5
    rx_slot_ms: 10

# -----------------------------------------------------------------------------
# Fig. 2 - Hardware validation against ReaDmE (Section V)
# -----------------------------------------------------------------------------
fig2_hardware_validation:
  reference: "Su and Ranasinghe, IEEE RFID 2021 (ReaDmE)"

  device:                           # WISP 5.1-LRG
    capacitance_f: 47.0e-6          # wisp5-hw bill of materials
    v_charged_v: 2.4                # S-882Z24 charge pump release
    v_min_v: 1.8                    # MSP430 brownout
    p_active_w: 0.23e-3             
    p_sleep_w: 1.44e-6              # MSP430 datasheet, LPM3

  link:
    reader_tx_dbm: 30
    reader_gain_dbi: 9
    tag_gain_dbi: 2
    carrier_frequency_hz: 920.0e6
    pathloss_model: fspl            
    shadowing_sigma_db: 0.3

  air_interface:                    # ReaDmE Table II
    t_a_ms: 0.630
    t_t_ms: 1.641
    tau: 1.1                        # ReaDmE Eq. 9 margin
    read_rate_window_s: 1.0

  sweep:
    distances_m: [0.20, 0.40, 0.60, 0.80]
    trials_per_cell: 10
    timestep_s: 1.0e-4

  efficiency:                       # received power (dBm) -> conversion efficiency
    23.26: 0.0006
    17.24: 0.0025
    13.72: 0.0031
    11.22: 0.0006
  idle_harvest_boost: 28.0

# -----------------------------------------------------------------------------
# Figs. 4-5 - Coverage map and node density (Section VII)
# -----------------------------------------------------------------------------
fig5_node_density:
  area_m: [500, 500]
  node_counts: [5, 10, 15, 20, 30, 40, 50, 60, 80, 100]
  node_placement_radius_m: 100      
  subcarrier_shifts: [1, 2, 3]
  repetitions: 10
  max_startup_time_ms: 0

  fsm_states:
    listening:    {duration_ms: 3,  current_a: 1.40e-4}
    sensing:      {duration_ms: 2,  current_a: 5.12e-4}
    processing:   {duration_ms: 5,  current_a: 1.28e-3}
    transmitting: {duration_ms: 30, current_a: 1.00e-3}

# -----------------------------------------------------------------------------
# Fig. 6 - Protocol comparison (Section VII)
# -----------------------------------------------------------------------------
fig6_protocol_comparison:
  base_stations: 1                  
  nodes: 30
  deployment_radii_m: [[5, 100], [5, 30]]
  protocols: [unicast, broadcast, broadcast_with_sic]
  energy_modes: [wpt, hybrid]
  repetitions: 10
  rx_slots_per_window: 10
  max_startup_time_ms: 0

  bs_schedule:
    tx_slot_ms: 5
    rx_slot_ms: 5

  fsm_states:
    listening:    {duration_ms: 3,  current_a: 1.40e-4}
    sensing:      {duration_ms: 2,  current_a: 5.12e-4}
    processing:   {duration_ms: 5,  current_a: 1.28e-3}
    transmitting: {duration_ms: 30, current_a: 1.00e-3}

# -----------------------------------------------------------------------------
# Fig. 7 - Feasibility of backscatter communication (Section VII)
# -----------------------------------------------------------------------------
fig7_feasibility:
  base_station:
    transmit_power_dbm: 43
    antenna_gain_dbi: 15
    sensitivity_dbm: -110.0
    height_m: 25.0
  node:
    antenna_type: isotropic
    height_m: 1.5
    series_resistance_ohm: 5.0e3
    v_threshold_high_v: 1.7
  sweep:
    frequencies_mhz: {start: 400, stop: 5000, points: 20}
    distances_m: {start: 10, stop: 500, points: 20}

# -----------------------------------------------------------------------------
# Fig. 8 - Computational cost (Section VIII)
# -----------------------------------------------------------------------------
fig8_computational_cost:
  deployment: "as fig5_node_density"
  node_counts: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80,
                90, 100, 125, 150, 175, 200, 225, 250, 275, 300]
  simulation_durations_s: [10, 20, 40]
  repetitions: 10
  measurement: "median wall-clock time and peak resident memory"
  platform:
    os: "Debian GNU/Linux 13 (virtual machine)"
    cpu: "Intel Xeon E5-2620 v3 (Haswell, 2.4 GHz), 4 vCPUs"
    memory_gb: 32
    python: "CPython 3.13.5"
